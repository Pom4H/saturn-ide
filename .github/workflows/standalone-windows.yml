name: Standalone Windows acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/build-standalone.ts'
      - 'scripts/standalone-video.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/standalone-windows.yml'

permissions:
  contents: read

concurrency:
  group: saturn-standalone-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: [self-hosted, windows]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          path: saturn-ide
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Pom4H/saturn-examples
          path: saturn-examples
          ssh-key: ${{ secrets.EXAMPLES_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Pom4H/saturn-plugins
          ref: d0716d560030de29eb59fce6ede2dea01db51e8b
          path: saturn-plugins
          ssh-key: ${{ secrets.PLUGINS_DEPLOY_KEY }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install IDE toolchain
        working-directory: saturn-ide
        run: bun install --frozen-lockfile
      - name: Share the locked toolchain with external source kits
        working-directory: saturn-ide
        run: |
          $modules=(Resolve-Path 'node_modules').Path
          New-Item -ItemType Directory -Force -Path 'node_modules\@saturn' | Out-Null
          if(-not (Test-Path 'node_modules\@saturn\core')){New-Item -ItemType Junction -Path 'node_modules\@saturn\core' -Target (Resolve-Path '.').Path | Out-Null}
          if(Test-Path '..\saturn-examples\node_modules'){Remove-Item '..\saturn-examples\node_modules' -Force -Recurse}
          if(Test-Path '..\saturn-plugins\node_modules'){Remove-Item '..\saturn-plugins\node_modules' -Force -Recurse}
          New-Item -ItemType Junction -Path '..\saturn-examples\node_modules' -Target $modules | Out-Null
          New-Item -ItemType Junction -Path '..\saturn-plugins\node_modules' -Target $modules | Out-Null
      - name: Check source before packaging
        working-directory: saturn-ide
        run: bun run check
      - name: Build Windows portable Saturn
        working-directory: saturn-ide
        run: bun scripts/build-standalone.ts windows-x64 dist/standalone ../saturn-examples/pumping-station
      - name: Verify compiled executable and record real UX
        working-directory: saturn-ide
        run: |
          $env:PORT='4017'
          $env:SATURN_PREVIEW='simulation'
          $project=(Resolve-Path 'dist\standalone\projects\pumping-station').Path
          $stdout=Join-Path $env:RUNNER_TEMP 'saturn-standalone.out.log'
          $stderr=Join-Path $env:RUNNER_TEMP 'saturn-standalone.err.log'
          $process=Start-Process -FilePath 'dist\standalone\saturn.exe' -ArgumentList @($project,'--no-open','--port','4017') -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $ready=$false
            for($i=0;$i -lt 120;$i++){try{$r=Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:4017/api/state' -TimeoutSec 2;if($r.StatusCode -eq 200){$ready=$true;break}}catch{};Start-Sleep -Milliseconds 250}
            if(-not $ready){Get-Content $stdout -ErrorAction SilentlyContinue;Get-Content $stderr -ErrorAction SilentlyContinue;throw 'Compiled Saturn did not start'}
            bun scripts/standalone-video.ts
            if($LASTEXITCODE -ne 0){throw 'UX recording failed'}
          } finally {
            if(-not $process.HasExited){Stop-Process -Id $process.Id -Force}
            Copy-Item $stdout standalone-video\server.out.log -ErrorAction SilentlyContinue
            Copy-Item $stderr standalone-video\server.err.log -ErrorAction SilentlyContinue
          }
      - name: Portable bundle size
        working-directory: saturn-ide
        run: |
          $exe=Get-Item 'dist\standalone\saturn.exe'
          $bundle=(Get-ChildItem 'dist\standalone' -File -Recurse | Measure-Object Length -Sum).Sum
          "saturn.exe = $([math]::Round($exe.Length/1MB,1)) MiB"
          "portable bundle = $([math]::Round($bundle/1MB,1)) MiB"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saturn-windows-standalone
          path: |
            saturn-ide/dist/standalone/
            saturn-ide/standalone-video/
          if-no-files-found: error
          retention-days: 14
