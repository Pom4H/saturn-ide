name: Apply reviewed coordinate correction
on:
  push:
    branches: [fix/foundation-shared-authoring]
    paths: [.github/workflows/authoring-repro.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/foundation-shared-authoring'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/foundation-shared-authoring
      - name: Apply exact locally tested edits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p=Path(path);s=p.read_text();assert s.count(old)==1,(path,old);p.write_text(s.replace(old,new))
          replace('src/shell/scene3d.tsx','import { connectionHandleVisible }','import { connectionDragPoint, connectionHandleVisible }')
          replace('src/shell/scene3d.tsx','plug.point={x:Math.round(point.x*100),y:Math.round(point.z*100),z:Math.round(point.y*100)};','plug.point=connectionDragPoint(plug.point,{x:point.x*100,y:point.z*100,z:point.y*100},e.shiftKey);')
          replace('src/shell/scene3d.tsx','const nextScreens=JSON.stringify([node.dataset.cameraPose,','const screenBox=renderer.domElement.getBoundingClientRect();const nextScreens=JSON.stringify([screenBox.left,screenBox.top,node.dataset.cameraPose,')
          replace('src/workspace/authoring-operations.ts','${Math.round(point.x)}, y: ${Math.round(point.y)}, z: ${Math.round(point.z)}','${point.x}, y: ${point.y}, z: ${point.z}')
          replace('.github/workflows/ci.yml','branches: [main, fix/foundation-shared-authoring]','branches: [main]')
          p=Path('tests/source-authoring.test.ts');s=p.read_text();assert 'inverse free endpoint edit preserves authored fractional coordinates' not in s
          s+='''\ntest('inverse free endpoint edit preserves authored fractional coordinates',async()=>{
            const f=fixture({'project.ts':source.replace('  // wire,','  wire,')});try{
              const frame=(await f.builder.build()).authoring!;
              const point={x:519.3571428571429,y:440.25,z:106};
              const changes=authoringChanges(frame.files,frame,{kind:'endpoint',id:'enable-drive',end:'from',target:point});
              for(const change of changes)f.workspace.save(change.path,change.source,change.version);
              const edge=(await f.builder.build()).project.cables![0]!;
              expect(isAttached(edge.from)).toBe(false);
              if(!isAttached(edge.from))expect(edge.from.position).toEqual(point);
            }finally{f.close();}
          });\n'''
          p.write_text(s)
          PY
          git diff --check
          git add src/shell/scene3d.tsx src/workspace/authoring-operations.ts tests/source-authoring.test.ts .github/workflows/ci.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: preserve untouched fractional coordinates through vertical gestures and source edits'
          git push origin HEAD:fix/foundation-shared-authoring
