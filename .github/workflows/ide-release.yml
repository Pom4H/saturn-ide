name: IDE executables
on:
  workflow_dispatch:
  push:
    tags: ['ide-v*']
permissions:
  contents: read
jobs:
  binary:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run ide:build
      - run: bun scripts/ide-smoke.ts
      - uses: actions/upload-artifact@v4
        with:
          name: ide-${{ matrix.os }}
          path: artifacts/distribution/*
  publish:
    if: startsWith(github.ref, 'refs/tags/ide-v')
    needs: binary
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/download-artifact@v4
        with:
          pattern: ide-*
          merge-multiple: true
          path: artifacts/distribution
      - run: bun scripts/ide-manifest.ts
      - name: Publish verified platform assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = "ide-v$(bun -p 'require("./package.json").version')"
          gh release create "$GITHUB_REF_NAME" artifacts/distribution/* --draft --title "Saturn $GITHUB_REF_NAME" --generate-notes
