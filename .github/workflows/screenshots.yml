name: Capture screenshots

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to capture and update
        required: true
        default: main
        type: string
  push:
    branches: [main]
    paths:
      - 'scripts/screenshots.ts'
      - 'src/shell/**'

concurrency:
  group: saturn-ide-screenshots-${{ inputs.branch || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.branch || github.ref_name }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.2-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.4.2-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Chromium
        run: bunx playwright install --with-deps chromium

      - name: Capture repository screenshots
        run: bun scripts/screenshots.ts

      - name: Upload screenshot evidence
        uses: actions/upload-artifact@v4
        with:
          name: saturn-screenshots
          path: docs/screenshots/
          if-no-files-found: error
          retention-days: 7

      - name: Store screenshots in selected branch
        env:
          TARGET_BRANCH: ${{ inputs.branch || github.ref_name }}
        run: |
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'docs: refresh Saturn screenshots'
            git fetch origin "$TARGET_BRANCH"
            git rebase "origin/$TARGET_BRANCH"
            git push origin "HEAD:$TARGET_BRANCH"
          fi
