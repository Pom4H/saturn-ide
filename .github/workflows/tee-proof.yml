name: Tee topology video proof

on:
  push:
    branches: [main]
    paths:
      - 'scripts/tee-proof-browser-test.ts'
      - 'tests/pipe-tee.test.ts'
      - 'src/core.ts'
      - 'src/topology.ts'
      - 'src/shell/scene.tsx'
      - 'src/shell/scene3d.tsx'
      - 'src/shell/symbols.tsx'
      - '.github/workflows/tee-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saturn-tee-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-tee-proof-bun-1.4.2-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-tee-proof-bun-1.4.2-
      - run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Ensure MP4 encoder
        run: command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Typecheck architecture
        run: bun run check
      - name: Tee unit contract
        run: bun test tests/pipe-tee.test.ts
      - name: Record real Shell proof
        run: bun scripts/tee-proof-browser-test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tee-topology-proof-${{ github.sha }}
          path: artifacts/tee-proof/
          if-no-files-found: error
          retention-days: 14
