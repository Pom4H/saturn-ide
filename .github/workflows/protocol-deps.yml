name: Resolve protocol SDK dependencies
on:
  push:
    branches: [main]
    paths: ['.github/workflows/protocol-deps.yml']
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Resolve and lock SDKs used by copied protocol examples and tests
        run: bun add --dev --exact mqtt@5 modbus-serial@8 node-opcua-client@2 node-opcua@2 aedes@0.51.3
      - name: Preserve existing type and architecture checks
        run: bun run check
      - name: Commit generated dependency lock only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json bun.lock
          git diff --cached --quiet && exit 0
          git commit -m 'chore(protocols): lock Modbus MQTT and OPC UA SDK test dependencies'
          git push origin HEAD:main
