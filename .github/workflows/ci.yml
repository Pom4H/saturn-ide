name: IDE architecture and integration checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saturn-ide-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: saturn-ide
      - uses: actions/checkout@v4
        with:
          repository: Pom4H/saturn-examples
          path: saturn-examples
          ssh-key: ${{ secrets.EXAMPLES_DEPLOY_KEY }}
      - uses: actions/checkout@v4
        with:
          repository: Pom4H/saturn-plugins
          ref: d0716d560030de29eb59fce6ede2dea01db51e8b
          path: saturn-plugins
          ssh-key: ${{ secrets.PLUGINS_DEPLOY_KEY }}
      - name: Snapshot exact source fixtures for manual reproduction
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[snapshot]')
        run: |
          mkdir checked-source
          for repo in saturn-ide saturn-examples saturn-plugins; do
            git -C "$repo" archive --format=tar.gz --prefix="$repo/" HEAD > "checked-source/$repo.tar.gz"
            git -C "$repo" rev-parse HEAD >> checked-source/revisions.txt
          done
      - name: Retain source-only verification inputs
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[snapshot]')
        uses: actions/upload-artifact@v4
        with:
          name: checked-source
          path: checked-source/
          retention-days: 3
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.2-${{ hashFiles('saturn-ide/bun.lock', 'saturn-ide/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.4.2-
      - run: bun install --frozen-lockfile
        working-directory: saturn-ide
      - name: Share test toolchain with external integration fixtures
        run: |
          mkdir -p saturn-ide/node_modules/@saturn
          ln -s ../.. saturn-ide/node_modules/@saturn/core
          ln -s ../saturn-ide/node_modules saturn-examples/node_modules
          ln -s ../saturn-ide/node_modules saturn-plugins/node_modules
      - name: Package explicitly requested offline toolchain
        if: contains(github.event.head_commit.message, '[toolchain]')
        run: |
          mkdir -p offline-toolchain/bin
          cp "$(command -v bun)" offline-toolchain/bin/bun
          tar -czf offline-toolchain/dependencies.tar.gz -C saturn-ide node_modules
      - name: Retain offline toolchain
        if: contains(github.event.head_commit.message, '[toolchain]')
        uses: actions/upload-artifact@v4
        with:
          name: offline-toolchain
          path: offline-toolchain/
          retention-days: 1
      - run: bun run check
        working-directory: saturn-ide
      - name: Unit, SQLite and protocol tests
        # Bound native SDK/socket cleanup so a leaked connection cannot occupy the runner.
        run: timeout --kill-after=10s 180s bun test tests
        working-directory: saturn-ide
      - name: Install browser recording dependency
        run: bunx playwright install ffmpeg
        working-directory: saturn-ide
      - name: Importer browser acceptance
        run: bun scripts/importer-browser-test.ts
        working-directory: saturn-ide
      - name: Physical editor browser acceptance
        timeout-minutes: 3
        run: timeout --kill-after=10s 120s bun scripts/physical-interaction-browser-test.ts
        working-directory: saturn-ide
      - name: Keep physical editor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physical-editor-evidence
          path: saturn-ide/artifacts/physical-editor/
          if-no-files-found: ignore
          retention-days: 3
      - name: Keep browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: importer-browser-failure
          path: |
            saturn-ide/artifacts/importer-failure.png
            saturn-ide/artifacts/importer-video/
          if-no-files-found: ignore
