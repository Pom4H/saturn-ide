name: IDE architecture and integration checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saturn-ide-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: saturn
          POSTGRES_PASSWORD: saturn-test-only
          POSTGRES_DB: saturn_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U saturn -d saturn_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgres://saturn:saturn-test-only@127.0.0.1:5432/saturn_test
    steps:
      - uses: actions/checkout@v4
        with:
          path: saturn-ide
      - uses: actions/checkout@v4
        with:
          repository: Pom4H/saturn-examples
          path: saturn-examples
          ssh-key: ${{ secrets.EXAMPLES_DEPLOY_KEY }}
      - uses: actions/checkout@v4
        with:
          repository: Pom4H/saturn-plugins
          ref: d0716d560030de29eb59fce6ede2dea01db51e8b
          path: saturn-plugins
          ssh-key: ${{ secrets.PLUGINS_DEPLOY_KEY }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.2-${{ hashFiles('saturn-ide/bun.lock', 'saturn-ide/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.4.2-
      - run: bun install --frozen-lockfile
        working-directory: saturn-ide
      - name: Share test toolchain with pinned integration fixtures
        run: |
          mkdir -p saturn-ide/node_modules/@saturn
          ln -s ../.. saturn-ide/node_modules/@saturn/core
          ln -s ../saturn-ide/node_modules saturn-examples/node_modules
          ln -s ../saturn-ide/node_modules saturn-plugins/node_modules
      - run: bun run check
        id: compile
        working-directory: saturn-ide
      - name: Unit, SQLite, PostgreSQL and protocol tests
        run: timeout --kill-after=10s 180s bun test tests
        working-directory: saturn-ide
      - name: Install browser recording dependency
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: bunx playwright install ffmpeg
        working-directory: saturn-ide
      - name: Decision text UX and System One contract acceptance
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        timeout-minutes: 3
        run: timeout --kill-after=10s 150s bun scripts/decision-browser-test.ts
        working-directory: saturn-ide
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decision-ux-evidence
          path: saturn-ide/artifacts/decision/
          if-no-files-found: ignore
          retention-days: 3
      - name: Importer browser acceptance
        run: bun scripts/importer-browser-test.ts
        working-directory: saturn-ide
      - name: Physical editor browser acceptance
        timeout-minutes: 3
        run: timeout --kill-after=10s 150s bun scripts/physical-interaction-browser-test.ts
        working-directory: saturn-ide
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physical-editor-evidence
          path: saturn-ide/artifacts/physical-editor/
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: importer-browser-failure
          path: |
            saturn-ide/artifacts/importer-failure.png
            saturn-ide/artifacts/importer-video/
          if-no-files-found: ignore
