name: MVP checks
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/screenshots/**'
  workflow_dispatch:

concurrency:
  group: saturn-ide-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.2-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.4.2-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

      - name: Unit and SQLite tests
        # Network/native SDK cleanup must finish; an orphan socket must not occupy a runner for 20 minutes.
        run: timeout --kill-after=10s 180s bun test tests
