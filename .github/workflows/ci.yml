name: MVP checks
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: saturn-ide-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: saturn
          POSTGRES_PASSWORD: saturn
          POSTGRES_DB: saturn
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgres://saturn:saturn@127.0.0.1:5432/saturn
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install
        run: |
          if test -f bun.lock; then bun install --frozen-lockfile; else bun install; fi

      - name: Typecheck
        run: bun run check

      - name: Unit and integration tests (SQLite and real PostgreSQL)
        run: bun test tests

      - name: Chromium
        run: bunx playwright install --with-deps chromium

      - name: Browser round trip and real screenshots
        run: bun run test:browser

      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: mvp-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
