name: MVP checks
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/screenshots/**'
      - 'bun.lock'
  workflow_dispatch:

concurrency:
  group: saturn-ide-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bootstrap-lockfile:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check lockfile
        id: lockfile
        run: |
          if test -f bun.lock; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.lockfile.outputs.exists != 'true'
        with:
          bun-version: '1.4.2'

      - name: Generate bun.lock
        if: steps.lockfile.outputs.exists != 'true'
        run: bun install --lockfile-only

      - name: Commit bun.lock
        if: steps.lockfile.outputs.exists != 'true'
        run: |
          git add bun.lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: add Bun lockfile'
          git push origin HEAD:main

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: saturn
          POSTGRES_PASSWORD: saturn
          POSTGRES_DB: saturn
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U saturn -d saturn" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgres://saturn:saturn@127.0.0.1:5432/saturn
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.2-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.4.2-

      - name: Install
        run: |
          if test -f bun.lock; then bun install --frozen-lockfile; else bun install; fi

      - name: Typecheck
        run: bun run check

      - name: Unit and integration tests (SQLite and real PostgreSQL)
        run: bun test tests

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.63.0

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Browser round trip
        run: bun run test:browser
