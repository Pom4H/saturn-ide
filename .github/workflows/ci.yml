name: MVP checks
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: saturn-ide-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # GitHub-hosted jobs for this private repository are currently failing before
    # step execution. Use the same proven Windows self-hosted runner as Saturn's
    # visual evidence workflows so browser screenshots are actually produced.
    runs-on: [self-hosted, windows]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install
        run: |
          if (Test-Path bun.lock) {
            bun install --frozen-lockfile
          } else {
            bun install
          }

      - name: Typecheck
        run: bun run check

      - name: Unit and integration tests
        run: bun test tests

      - name: Chromium
        run: bunx playwright install chromium

      - name: Browser round trip and real screenshots
        run: bun run test:browser

      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: mvp-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
